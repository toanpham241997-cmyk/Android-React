name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: gamecore-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight source check
        run: |
          set -euo pipefail
          node --version
          npm --version
          python3 scripts/check-project.py --phase source

      - name: Install React packages
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --loglevel=warn 2>&1 | tee npm-install.log

      - name: Compile React and Android web assets
        run: |
          set -euo pipefail
          npm run android 2>&1 | tee react-build.log
          python3 scripts/check-project.py --phase assets

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee android-sdk.log

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee ../android-build.log

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" > APK-SHA256.txt
          cat APK-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUJUNPEAK-GameCore-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GAMECORE-BUILD-ERROR-LOGS
          path: |
            npm-install.log
            react-build.log
            android-sdk.log
            android-build.log
            /home/runner/.npm/_logs/*.log
          if-no-files-found: warn
          retention-days: 14
