plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.aujunpeak.gamecore'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.aujunpeak.gamecore'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
